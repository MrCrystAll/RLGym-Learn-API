# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install git+https://github.com/MrCrystAll/rlgym-learn.git@GUI
      - run: pip install git+https://github.com/MrCrystAll/rlgym-learn-algos.git@GUI
      - run: pip install wandb
      - run: pip install -e .
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false # never use caching in release builds

      - name: Export OpenAPI spec
        run: python scripts/export_openapi.py

      - name: Generate TypeScript client
        run: |
          npx @openapitools/openapi-generator-cli generate \
            -i openapi.json \
            -g typescript-fetch \
            -o src/client \
            -c typescript-axios-config.yaml

      - name: Sync version
        run: |
          VERSION=$(python -c "import importlib.metadata; print(importlib.metadata.version('rlgym_learn_api'))")
          npm version $VERSION --no-git-tag-version
        working-directory: src/client

      - name: Build
        run: |
          npm install
          npm run build
        working-directory: src/client

      - name: Publish to npm
        run: npm publish
        working-directory: src/client
