name: Pyinstaller

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  set-version:
    name: Set Version from Tag
    runs-on: ubuntu-latest

    outputs:
      python-version: ${{ steps.convert.outputs.python-version }}
      npm-version: ${{ steps.convert.outputs.npm-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # full history needed to detect the branch behind the tag

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Convert tag to Python and npm versions
        id: convert
        run: |
          python3 << 'EOF'
          import re, os
          tag = os.environ["GITHUB_REF_NAME"]
          raw = tag.lstrip("v")
          py_map = {"alpha": "a", "beta": "b", "rc": "rc"}
          m = re.match(r"^(\d+\.\d+\.\d+)(?:-([a-z]+)\.(\d+))?$", raw)
          if not m:
              raise ValueError(f"Tag '{tag}' does not match vX.Y.Z[-pre.N] format")
          base, pre_name, pre_num = m.groups()
          if pre_name:
              py_pre = py_map.get(pre_name, pre_name)
              python_version = f"{base}{py_pre}{pre_num}"
          else:
              python_version = base
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"python-version={python_version}\n")
          EOF

      - name: Patch pyproject.toml
        run: |
          pip install toml-cli
          toml set --toml-path pyproject.toml project.version "${{ steps.convert.outputs.python-version }}"

      - name: Commit and push version bump
        run: |
          # find which branch this tag points to
          BRANCH=$(git branch -r --contains ${{ github.ref_name }} \
            | grep -v HEAD \
            | sed 's|origin/||' \
            | tr -d ' ' \
            | head -1)

          echo "Pushing version bump to branch: $BRANCH"

          git checkout $BRANCH
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ github.ref_name }} [skip ci]"
          git push origin $BRANCH

  build-api:
    name: Build API (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact-name: api-windows
            output-name: main.exe
          - os: ubuntu-latest
            artifact-name: api-linux
            output-name: main

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/MrCrystAll/rlgym-learn.git@GUI
          pip install git+https://github.com/MrCrystAll/rlgym-learn-algos.git@GUI
          pip install -e .
          pip install wandb uvicorn pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller main.spec

      - name: Upload API binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ./dist/${{ matrix.output-name }}
          retention-days: 1 # only needed during this workflow run

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-api

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: api-windows
          path: ./release-files/

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: api-linux
          path: ./release-files/

      - name: Extract release notes from CHANGELOG.md
        id: extract_release_notes
        uses: ffurrer2/extract-release-notes@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: ./release-files/*
          body: ${{ steps.extract_release_notes.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
